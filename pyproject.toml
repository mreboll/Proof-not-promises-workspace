[project]
name = "tieto-ledger"
version = "0.1.0"
description = "Risk-Scoped Evidence Ledger: AI review of AI-written code, backed by executable evidence."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "openai>=1.40",        # cliente OpenAI-compatible para NVIDIA Nemotron
    "modal>=1.0",          # sandboxes para ejecutar tests generados por IA
    "pydantic>=2.7",
    "jinja2>=3.1",
    "typer>=0.12",
    "unidiff>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ledger = "ledger.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
