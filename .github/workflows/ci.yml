# CI en CRACI (bounty "Best use of CRACI"): cada build registra qué entra en el software
# (dependencias de Python y, más adelante, paquetes NuGet de la sonda). Encaja con la tesis:
# no se aprueba nada sin evidencia, tampoco nuestras propias dependencias.
name: ci

on:
  push:
    branches: [main, "a/**", "b/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: craci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: "Unit tests (sin claves: los LLM se simulan)"
        run: python -m pytest -q --cov=ledger --cov-report=term-missing
      - name: Pipeline con fixtures
        run: python -m ledger run --issue 2283 --fixtures --fake-runner
